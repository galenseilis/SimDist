[project]
name = "SimDist"
version = "0.1.2"
description = "Probability distributions for simulations in Python."
authors = [
    {name = "galenseilis", email = "galen.seilis@seilis.ca"},
]
dependencies = [
    "numpy>=2.1.2",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "Apache-2.0"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simdist"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.5",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings[python]>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
