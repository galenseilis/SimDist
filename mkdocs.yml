site_name: SimDist
site_description: Probability distributions for simulations in Python.
site_url: https://galenseilis.github.io/SimDist/
repo_url: https://github.com/galenseilis/SimDist
repo_name: galenseilis/SimDist
edit_uri: edit/main/docs/
copyright: Copyright &copy; galenseilis &mdash; Apache-2.0

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - navigation.instant.preview
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Your first distribution: tutorials/your-first-distribution.md
      - Composing distributions: tutorials/composing-distributions.md
  - How-to guides:
      - how-to/index.md
      - Install SimDist: how-to/install.md
      - Draw samples in a batch: how-to/batch-sampling.md
      - Truncate a distribution: how-to/rejection-sampling.md
      - Write your own distribution: how-to/custom-distribution.md
  - Reference:
      - reference/index.md
      - Core API: reference/core.md
      - Distributions: reference/dists.md
      - Rejectors: reference/rejectors.md
  - Explanation:
      - explanation/index.md
      - Architecture: explanation/architecture.md
      - Design decisions: explanation/design-decisions.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            inherited_members: false
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/galenseilis/SimDist
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/SimDist/

strict: true
